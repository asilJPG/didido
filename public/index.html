<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="theme-color" content="#f9d0dc"/><title>Это сделано?</title><link rel="stylesheet" href="/style.css"/></head>
<body><section id="auth-screen" class="auth-screen"><div class="auth-card"><div class="brand-mark">✓</div><p class="eyebrow">ЛИЧНЫЙ ТРЕКЕР</p><h1>Это сделано?</h1><p class="auth-copy">Заходи под своим логином или создай отдельный аккаунт.</p><form id="auth-form"><label>Логин<input id="username" required pattern="[a-zA-Z0-9_-]{3,30}" placeholder="asil" autocomplete="username"/></label><label>Пароль<input id="password" required minlength="6" type="password" placeholder="Минимум 6 символов" autocomplete="current-password"/></label><button id="auth-submit" class="auth-submit" type="submit">Войти</button></form><button id="auth-switch" class="text-button">Создать аккаунт</button><p id="auth-error" class="form-error" role="alert"></p></div></section>
<main id="app" class="app-shell" hidden><header><div class="brand-mark">✓</div><div><p class="eyebrow">ТВОЯ ПРОВЕРКА НА СЕГОДНЯ</p><h1>Это сделано?</h1></div><button id="profile-button" class="more" aria-label="Профили">•••</button></header><section class="hero"><span id="date">Сегодня</span><strong id="progress">0 из 0</strong><div class="progress-track"><i id="progress-bar"></i></div></section><section aria-label="Задачи"><div id="task-list" class="task-list"></div><p id="empty" hidden>Добавь первую вещь, о которой не хочется гадать.</p></section><form id="add-form" class="add-form"><button class="add-icon" type="submit" aria-label="Добавить">+</button><input id="task-title" maxlength="100" placeholder="Добавить новую проверку…" autocomplete="off"/><button class="submit" type="submit">Добавить</button></form></main>
<dialog id="profiles-dialog"><div class="dialog-title"><h2>Профили</h2><button id="close-dialog">×</button></div><div id="profiles-list"></div><form id="profile-form"><input id="profile-name" maxlength="80" placeholder="Новый профиль"/><button type="submit">Добавить</button></form><button id="sign-out" class="text-button">Выйти из аккаунта</button></dialog><template id="task-template"><article class="task"><button class="check" aria-label="Отметить выполненной"></button><span class="task-icon"></span><div class="task-copy"><h2></h2><p></p></div><button class="yes" aria-label="Ответ"></button></article></template><script src="/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/app.js"></script></body></html>
